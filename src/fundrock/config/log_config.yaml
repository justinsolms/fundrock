version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: "%(asctime)s : %(levelname)8s : %(message)s"
  detail:
    format: "%(asctime)s : %(levelname)8s : %(module)12s : %(lineno)4d : %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detail
    stream: ext://sys.stdout
  file:
    class: fundrock.dblogging.FileHandler
    when: midnight
    encoding: utf-8
    backupCount: 10
    formatter: detail
    level: DEBUG
loggers:
  fundrock:
    level: INFO
    handlers: [console, file]
    propagate: no
root:
  level: INFO
  handlers: [console]
