[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundrock"
version = "0.1.0"
description = "A new Python package"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["financial", "management", "funds", "investments"]
dependencies = [
    "setuptools",
    "sqlalchemy",
    "pandas",
]

[[project.authors]]
name = "Justin Solms"
email = "justinsolms@gmail.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
